<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berlin Church Hours Board: Which Churches Are Open on Your Day</title>
<link rel="stylesheet" href="../css/brand.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FFFFFF; color: #1f2a1c; padding: 12px; }
  .ch { border: 1px solid #e3e0d4; border-radius: 16px; overflow: hidden; background: #fdfcf7; }
  .ch-top { padding: 15px 16px 12px; background: #20301f; color: #f4f1e6; }
  .ch-top h1 { font-size: 18px; line-height: 1.25; font-weight: 800; }
  .ch-top h1 em { font-style: normal; color: #FFE600; }
  .ch-top p { font-size: 12.5px; line-height: 1.5; color: #d6d2c2; margin-top: 4px; }
  .ch-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 12px 16px 4px; }
  .ch-days button { font-family: inherit; cursor: pointer; font-size: 12.5px; font-weight: 800; padding: 9px 0; border-radius: 10px; border: 1.5px solid #cfcab6; background: #fff; color: #2c3527; }
  .ch-days button[aria-pressed=true] { background: #1B5E20; border-color: #1B5E20; color: #FFE600; }
  .ch-days button:focus-visible, .ch-row:focus-visible { outline: 2px solid #c62828; outline-offset: 2px; }
  .ch-sum { padding: 8px 16px 0; font-size: 13.5px; line-height: 1.5; }
  .ch-sum b { color: #1B5E20; }
  .ch-chart { padding: 6px 10px 0 10px; }
  .ch-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ch-row { cursor: pointer; }
  .ch-row:hover .ch-rowbg { fill: #f3efe0; }
  .ch-rowbg { fill: transparent; }
  .ch-row.is-sel .ch-rowbg { fill: #fff7b8; }
  .ch-name { font-size: 12px; font-weight: 700; fill: #1f2a1c; }
  .ch-price { font-size: 10px; fill: #6d6a58; }
  .ch-tick { font-size: 10px; fill: #6d6a58; text-anchor: middle; }
  .ch-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 16px 0; font-size: 11.5px; color: #4b4a3e; }
  .ch-legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .ch-detail { margin: 10px 16px 0; padding: 11px 13px; border-radius: 12px; background: #fff; border: 1px solid #e3e0d4; font-size: 13px; line-height: 1.55; }
  .ch-detail h2 { font-size: 14.5px; margin-bottom: 2px; }
  .ch-detail .meta { font-size: 12px; color: #5d5b4c; margin-bottom: 4px; }
  .ch-detail .today { font-weight: 700; color: #1B5E20; }
  .ch-detail .today.is-shut { color: #a33a2f; }
  .ch-move { margin: 10px 16px 0; padding: 10px 13px; border-radius: 12px; background: #FFE600; color: #123D18; font-size: 13px; line-height: 1.5; font-weight: 600; }
  .ch-move b { font-weight: 800; color: #123D18; }
  .ch-foot { padding: 10px 16px 14px; font-size: 11px; color: #6d6a58; line-height: 1.5; }
  @media (max-width: 420px) { .ch-days button { font-size: 11.5px; padding: 8px 0; } .ch-top h1 { font-size: 16.5px; } }
</style>
</head>
<body>
<div class="ch" id="chRoot">
  <div class="ch-top">
    <h1>Which Berlin churches are <em>open</em> on your day</h1>
    <p>Seven churches between Alexanderplatz, Museum Island and Gendarmenmarkt, plus the Memorial Church in the west. Pick a day, then tap a church.</p>
  </div>
  <div class="ch-days" role="group" aria-label="Day of the week" id="chDays"></div>
  <p class="ch-sum" id="chSum" aria-live="polite"></p>
  <div class="ch-chart" id="chChart"></div>
  <div class="ch-legend">
    <span><i style="background:#7CB342"></i>Free entry</span>
    <span><i style="background:#FFE600;border:1px solid #c9b800"></i>Paid ticket</span>
    <span><i style="background:#1B5E20;opacity:.16"></i>Best overlap in Mitte</span>
    <span><i style="background:#fff;border:1.5px dashed #8d8a78"></i>Irregular</span>
  </div>
  <div class="ch-detail" id="chDetail" aria-live="polite"></div>
  <p class="ch-move" id="chMove"></p>
  <p class="ch-foot" id="chFoot"></p>
</div>
<script>
(function () {
  var D, day, sel = 'dom';
  var NS = 'http://www.w3.org/2000/svg';
  var LONG = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday' };
  function $(id) { return document.getElementById(id); }
  function el(n, a, t) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); if (t != null) e.textContent = t; return e; }
  function hh(h) { var m = Math.round((h % 1) * 60); return String(Math.floor(h)).padStart(2, '0') + ':' + String(m).padStart(2, '0'); }
  function berlinDay() {
    try { var s = new Intl.DateTimeFormat('en-GB', { weekday: 'short', timeZone: 'Europe/Berlin' }).format(new Date()); return s.slice(0, 3); } catch (e) { return 'Mon'; }
  }
  function openAt(c, d, h) { return (c.hours[d] || []).some(function (w) { return h >= w[0] && h < w[1]; }); }
  function mitte() { return D.churches.filter(function (c) { return c.id !== 'kwg' && !c.irregular; }); }
  function bestWindow(d) {
    var best = 0, from = null, to = null, cur = null;
    for (var h = D.axis.start; h < D.axis.end; h += 0.5) {
      var n = mitte().filter(function (c) { return openAt(c, d, h); }).length;
      if (n > best) { best = n; from = h; to = h + 0.5; cur = n; }
      else if (n === best && to === h) { to = h + 0.5; }
    }
    return { n: best, from: from, to: to };
  }
  function draw() {
    var host = $('chChart'); host.innerHTML = '';
    var W = Math.max(320, host.clientWidth || 640), small = W < 520;
    var L = small ? 118 : 236, R = 8, top = 22, rowH = small ? 34 : 32;
    var rows = D.churches.length, H = top + rows * rowH + 6;
    var x = function (h) { return L + (h - D.axis.start) / (D.axis.end - D.axis.start) * (W - L - R); };
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Opening hours of Berlin churches on ' + LONG[day] });
    var bw = bestWindow(day);
    if (bw.n > 0) svg.appendChild(el('rect', { x: x(bw.from), y: top - 4, width: x(bw.to) - x(bw.from), height: rows * rowH + 4, fill: '#1B5E20', opacity: '.10', rx: 4 }));
    for (var h = D.axis.start; h <= D.axis.end; h++) {
      svg.appendChild(el('line', { x1: x(h), x2: x(h), y1: top - 4, y2: H - 4, stroke: '#e4e0d0', 'stroke-width': 1 }));
      if (!small || h % 2 === 1) svg.appendChild(el('text', { x: x(h), y: 12, class: 'ch-tick' }, String(h)));
    }
    D.churches.forEach(function (c, i) {
      var y = top + i * rowH, g = el('g', { class: 'ch-row' + (c.id === sel ? ' is-sel' : ''), tabindex: 0, role: 'button', 'aria-label': c.name });
      g.appendChild(el('rect', { class: 'ch-rowbg', x: 0, y: y, width: W, height: rowH, rx: 6 }));
      var nm = small ? c.name.replace('Kaiser Wilhelm Memorial Church', 'Memorial Church').replace('Französische Friedrichstadtkirche', 'French Church').replace('Friedrichswerdersche Kirche', 'Friedrichswerder').replace("St. Hedwig's Cathedral", 'St. Hedwig') : c.name;
      g.appendChild(el('text', { x: 6, y: y + (small ? 15 : 14), class: 'ch-name' }, nm));
      g.appendChild(el('text', { x: 6, y: y + (small ? 27 : 26), class: 'ch-price' }, c.irregular ? 'irregular' : c.price.replace(' (reduced EUR 12)', '').replace(' (under 18 free)', '')));
      var by = y + 7, bh = rowH - 14;
      if (c.irregular) {
        g.appendChild(el('rect', { x: x(D.axis.start) + 1, y: by, width: x(D.axis.end) - x(D.axis.start) - 2, height: bh, rx: 5, fill: 'none', stroke: '#8d8a78', 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
        g.appendChild(el('text', { x: (x(D.axis.start) + x(D.axis.end)) / 2, y: by + bh / 2 + 4, class: 'ch-price', 'text-anchor': 'middle' }, 'open only now and then'));
      } else {
        var ws = c.hours[day] || [];
        if (!ws.length) g.appendChild(el('text', { x: x(D.axis.start) + 6, y: by + bh / 2 + 4, class: 'ch-price', fill: '#a33a2f' }, 'closed on ' + LONG[day]));
        ws.forEach(function (w) {
          g.appendChild(el('rect', { x: x(w[0]), y: by, width: x(w[1]) - x(w[0]), height: bh, rx: 5, fill: c.paid ? '#FFE600' : '#7CB342', stroke: c.paid ? '#c9b800' : '#5d8f2f', 'stroke-width': 1 }));
          var lbl = hh(w[0]) + '-' + hh(w[1]);
          if (x(w[1]) - x(w[0]) > 74) g.appendChild(el('text', { x: x(w[0]) + 6, y: by + bh / 2 + 4, 'font-size': 10.5, 'font-weight': 700, fill: c.paid ? '#123D18' : '#ffffff' }, lbl));
        });
        if (c.lastEntry && ws.length) g.appendChild(el('line', { x1: x(c.lastEntry), x2: x(c.lastEntry), y1: by - 3, y2: by + bh + 3, stroke: '#c62828', 'stroke-width': 2 }));
        (c.chimes || []).forEach(function (t) { g.appendChild(el('circle', { cx: x(t), cy: by + bh + 3, r: 3.2, fill: '#1B5E20' })); });
      }
      g.addEventListener('click', function () { sel = c.id; render(); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sel = c.id; render(); } });
      svg.appendChild(g);
    });
    host.appendChild(svg);
  }
  function detail() {
    var c = D.churches.filter(function (k) { return k.id === sel; })[0];
    var ws = c.hours[day] || [], box = $('chDetail'); box.innerHTML = '';
    var h2 = document.createElement('h2'); h2.textContent = c.name; box.appendChild(h2);
    var meta = document.createElement('p'); meta.className = 'meta';
    meta.textContent = c.place + ' · ' + c.price + (c.minutes ? ' · allow about ' + c.minutes + ' min' : ''); box.appendChild(meta);
    var t = document.createElement('p'); t.className = 'today' + (ws.length || c.irregular ? '' : ' is-shut');
    t.textContent = c.irregular ? 'Opening is irregular.' : ws.length ? LONG[day] + ': ' + ws.map(function (w) { return hh(w[0]) + ' to ' + hh(w[1]); }).join(', ') + (c.lastEntry ? ', last entry ' + hh(c.lastEntry) : '') : 'Closed on ' + LONG[day] + '.';
    box.appendChild(t);
    var s = document.createElement('p'); s.textContent = c.see; box.appendChild(s);
    var n = document.createElement('p'); n.className = 'meta'; n.style.marginTop = '4px'; n.textContent = c.note; box.appendChild(n);
  }
  function summary() {
    var m = mitte(), open = m.filter(function (c) { return (c.hours[day] || []).length; });
    var shut = m.filter(function (c) { return !(c.hours[day] || []).length; }).map(function (c) { return c.name; });
    var bw = bestWindow(day);
    var s = $('chSum'); s.innerHTML = '';
    var b = document.createElement('b'); b.textContent = LONG[day] + ': ' + open.length + ' of ' + m.length; s.appendChild(b);
    s.appendChild(document.createTextNode(' Mitte churches open' + (shut.length ? ' (shut: ' + shut.join(', ') + ')' : '') + '. ' + (bw.n ? bw.n + ' are open together from ' + hh(bw.from) + ' to ' + hh(bw.to) + '.' : '')));
    var moves = {
      Mon: 'Monday is the one day Friedrichswerder stays shut. I would start at the Parochialkirche before 14:00, then St. Marienkirche, and give the Dom the afternoon.',
      Sun: 'Sunday mornings belong to services: the Dom opens at 12:00 and St. Hedwig at 13:00, and the Parochialkirche stays shut. I would do St. Marienkirche at 10:00 and keep the Dom for after lunch.',
      Sat: 'Saturday has no Parochialkirche, but everything else runs. I would go to the Dom at 9:00 before the groups, then walk to St. Hedwig for 11:00.',
      Thu: 'Thursday is the late day at the Nikolaikirche, open until 20:00. I would do the free churches by daylight and keep the Nikolaikirche for the evening.',
      Fri: 'Friday is the long day at St. Hedwig, open until 20:00. I would end there after the Dom closes at 18:00.'
    };
    var mv = moves[day] || 'On a ' + LONG[day] + ' every Mitte church on this board opens. I would see the Parochialkirche before 14:00, go to the Dom at 9:00 or after 16:00 when it is quieter, and fill the middle of the day with the free ones.';
    $('chMove').innerHTML = ''; var bb = document.createElement('b'); bb.textContent = 'My move: '; $('chMove').appendChild(bb); $('chMove').appendChild(document.createTextNode(mv));
  }
  function render() {
    Array.prototype.forEach.call($('chDays').children, function (b) { b.setAttribute('aria-pressed', b.dataset.d === day ? 'true' : 'false'); });
    draw(); detail(); summary();
  }
  function init() {
    day = berlinDay(); if (D.days.indexOf(day) < 0) day = 'Mon';
    D.days.forEach(function (d) {
      var b = document.createElement('button'); b.type = 'button'; b.dataset.d = d; b.textContent = d; b.setAttribute('aria-label', LONG[d]);
      b.addEventListener('click', function () { day = d; render(); }); $('chDays').appendChild(b);
    });
    var lastW = 0; window.addEventListener('resize', function () { var w = $('chChart').clientWidth; if (Math.abs(w - lastW) > 20) { lastW = w; draw(); } });
    $('chFoot').textContent = 'Hours and prices from each church’s own website, checked on ' + D.checked + '. Services, concerts and holidays can close a church at short notice. The red mark is the Dom’s last entry; the green dots are the Parochialkirche carillon at 9, 12, 15 and 18. Minutes per church are my own estimates.';
    render();
  }
  fetch('data.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) { D = d; init(); });
})();
</script>
<script src="../js/brand.js"></script>
</body>
</html>
