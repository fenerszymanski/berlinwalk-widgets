<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berlin Bouldering Cost Curve</title>
<link rel="stylesheet" href="../css/brand.css">
<style>
  :root {
    --green: #1B5E20;
    --deep: #123D18;
    --yellow: #FFE600;
    --lime: #7CB342;
    --soft: #C5E1A5;
    --paper: #FBFAF4;
    --ink: #212121;
    --muted: #5b655c;
    --line: rgba(18,61,24,.16);
    --red: #E63946;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--paper); color: var(--ink); }
  .cc { max-width: 820px; margin: 0 auto; padding: 14px 12px; }
  .cc-head h2 { margin: 0 0 4px; font-size: 1.1rem; line-height: 1.3; color: var(--deep); }
  .cc-head p { margin: 0; font-size: .8rem; line-height: 1.5; color: var(--muted); }

  .cc-q { margin-top: 12px; display: grid; gap: 8px; }
  .cc-q-row { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 8px; }
  .cc-q-row > span { font-size: .62rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--deep); }
  .cc-opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .cc-opts button {
    font-family: inherit; font-size: .78rem; font-weight: 700; cursor: pointer; color: var(--deep);
    min-width: 42px; padding: 7px 10px; border: 1.5px solid rgba(27,94,32,.3); border-radius: 999px; background: #fff;
  }
  .cc-opts button[aria-checked="true"] { background: var(--deep); border-color: var(--deep); color: #fff; }
  .cc-opts button:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }

  .cc-plot { margin-top: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px 6px; }
  .cc-plot canvas { display: block; width: 100%; height: 300px; }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 4px 2px; font-size: .66rem; color: var(--muted); }
  .cc-legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .cc-legend i.dash { background: repeating-linear-gradient(90deg, var(--red) 0 4px, transparent 4px 7px); height: 2px; }

  .cc-verdict { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--yellow); color: var(--deep); font-size: .84rem; line-height: 1.5; }
  .cc-verdict b { color: var(--deep); }

  .cc-rank { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
  .cc-rank li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  .cc-rank li.top { border-color: var(--green); box-shadow: inset 4px 0 0 var(--green); }
  .cc-n { font-weight: 800; font-size: .95rem; color: var(--green); }
  .cc-name { margin: 0; font-size: .86rem; font-weight: 800; color: var(--deep); }
  .cc-name small { font-weight: 600; color: var(--muted); font-size: .7rem; }
  .cc-how { margin: 3px 0 0; font-size: .74rem; line-height: 1.45; color: var(--ink); }
  .cc-eur { text-align: right; font-weight: 800; font-size: .95rem; color: var(--deep); white-space: nowrap; }
  .cc-eur small { display: block; font-weight: 600; font-size: .66rem; color: var(--muted); }
  .cc-foot { margin: 12px 0 0; font-size: .68rem; line-height: 1.5; color: var(--muted); }
  @media (max-width: 480px) {
    .cc-q-row { grid-template-columns: 1fr; gap: 4px; }
    .cc-plot canvas { height: 240px; }
    .cc-rank li { grid-template-columns: 24px 1fr auto; gap: 8px; padding: 9px 10px; }
  }
</style>
</head>
<body>
<div class="cc">
  <div class="cc-head">
    <h2>What bouldering in Berlin really costs you per month</h2>
    <p>Pick how often you actually go. The chart draws each hall's cheapest way in at every visit count, and the list ranks the halls for yours.</p>
  </div>

  <div class="cc-q">
    <div class="cc-q-row"><span>Visits a month</span><div class="cc-opts" id="optVisits" role="radiogroup" aria-label="Visits a month"></div></div>
    <div class="cc-q-row"><span>Your rate</span><div class="cc-opts" id="optRate" role="radiogroup" aria-label="Your rate"></div></div>
    <div class="cc-q-row"><span>Time of day</span><div class="cc-opts" id="optTime" role="radiogroup" aria-label="Time of day"></div></div>
  </div>

  <div class="cc-plot">
    <canvas id="plot" aria-label="Monthly cost per hall against visits a month" role="img"></canvas>
    <div class="cc-legend" id="legend"></div>
  </div>

  <div class="cc-verdict" id="verdict" aria-live="polite"></div>
  <ol class="cc-rank" id="rank"></ol>
  <p class="cc-foot" id="foot"></p>
</div>

<script>
(function () {
  /* DATA_START */
  var DATA = {
    halls: [
      { id: 'kegel', name: 'Der Kegel', area: 'Friedrichshain', station: 'S+U Warschauer Straße', note: 'A converted bunker on the RAW site, open 09:00 to 23:00 every day.',
        prices: { adult: { day: 11, early: 9, ten: 99, tenVisits: 10, member: [{ name: 'month card', month: 59 }] }, reduced: { day: 9, member: [{ name: 'month card', month: 49 }] } } },
      { id: 'bk', name: 'Boulderklub Kreuzberg', area: 'Kreuzberg', station: 'U Görlitzer Bahnhof', note: 'Opens at 07:00 on weekdays.',
        prices: { adult: { day: 13.5, early: 11, ten: 121.5, tenVisits: 10, member: [{ name: 'membership', month: 54 }] }, reduced: { day: 11, member: [{ name: 'membership', month: 44 }] } } },
      { id: 'berta', name: 'Berta Block', area: 'Pankow', station: 'S+U Pankow', note: 'Open to 23:00 on weekdays.',
        prices: { adult: { day: 14.5, early: 12.5, ten: 130.5, tenVisits: 10, member: [{ name: 'membership', month: 60 }] }, reduced: { day: 11, member: [{ name: 'membership', month: 50 }] } } },
      { id: 'garten', name: 'Bouldergarten', area: 'Neukölln', station: 'S Sonnenallee', note: 'The one-month card includes the sauna.',
        prices: { adult: { day: 13.5, early: 11.5, ten: 120, tenVisits: 10, member: [{ name: 'one-month card with sauna', month: 89 }] }, reduced: { day: 10, member: [{ name: 'one-month card with sauna', month: 66 }] } } },
      { id: 'elektra', name: 'Elektra', area: 'Gesundbrunnen', station: 'U Voltastraße', note: 'Membership is 50 euro if you pay by direct debit.',
        prices: { adult: { day: 14.5, early: 11.5, ten: 125, tenVisits: 10, member: [{ name: 'membership', month: 55 }] }, reduced: { day: 11.5, member: [{ name: 'membership', month: 45 }] } } },
      { id: 'ostbloc', name: 'Ostbloc', area: 'Rummelsburg', station: 'S Betriebsbahnhof Rummelsburg', note: 'The 50 euro rate is a 12-month contract; a single month card is 65.',
        prices: { adult: { day: 12, early: 9, ten: 120, tenVisits: 11, member: [{ name: '12-month membership', month: 50 }] }, reduced: { day: 10, member: [{ name: '12-month membership', month: 42 }] } } },
      { id: 'sued', name: 'Südbloc', area: 'Mariendorf', station: 'U Alt-Mariendorf', note: 'The cheapest weekday morning ticket in Berlin. Membership is a 12-month contract.',
        prices: { adult: { day: 12, early: 8, ten: 120, tenVisits: 11, member: [{ name: '12-month membership', month: 52 }] }, reduced: { day: 9, member: [{ name: '12-month membership', month: 42 }] } } },
      { id: 'ua', name: 'urban apes (Basement, Wedding, bright site)', area: 'Kreuzberg, Wedding, Schöneberg', station: 'S Anhalter Bahnhof, U Seestraße, S Südkreuz', note: 'The 10+1 card only works in the hall where you bought it. Memberships add a 19.90 euro joining fee.',
        prices: { adult: { day: 13.9, early: 11.9, ten: 139, tenVisits: 11, member: [{ name: 'S membership (4 visits)', month: 39.9, cap: 4, fee: 19.9, term: 3 }, { name: 'M membership', month: 59.9, fee: 19.9, term: 3 }] }, reduced: { day: 11.9, member: [{ name: 'S membership (4 visits)', month: 34.9, cap: 4, fee: 19.9, term: 3 }, { name: 'M membership', month: 49.9, fee: 19.9, term: 3 }] } } },
      { id: 'cliff', name: 'Cliffhanger', area: 'Spandau', station: 'U Zitadelle', note: 'Its 11-visit card never expires.',
        prices: { adult: { day: 13, ten: 130, tenVisits: 11, member: [{ name: 'month card', month: 65 }] }, reduced: { day: 11.5, member: [{ name: 'month card', month: 57.5 }] } } },
      { id: 'ninja', name: 'Ninja Bloc', area: 'Köpenick', station: 'S Hirschgarten', note: 'A small 150 square metre room next to a ninja course hall. Closed on Wednesdays.',
        prices: { adult: { day: 9, ten: 89, tenVisits: 11, member: [] }, reduced: { day: 7, member: [] } } },
      { id: 'magic', name: 'Magic Mountain', area: 'Gesundbrunnen', station: 'U Pankstraße', note: 'Mostly a rope hall with a boulder area, which is why it costs more.',
        prices: { adult: { day: 20, early: 14, ten: 180, tenVisits: 10, member: [{ name: 'membership', month: 100 }] }, reduced: { day: 15, member: [{ name: 'membership', month: 80 }] } } },
      { id: 'bb', pass: true, name: 'Berlin bouldert pass', area: 'six halls', station: 'Bouldergarten, Boulderklub, Elektra, Der Kegel, Ostbloc, Südbloc', note: 'One app pass for six independent halls, one month notice.',
        prices: { adult: { member: [{ name: 'small pass (4 visits)', month: 39, cap: 4 }, { name: 'unlimited pass', month: 59 }] }, reduced: { member: [{ name: 'small pass (4 visits)', month: 39, cap: 4 }, { name: 'unlimited pass', month: 59 }] } } },
      { id: 'usc', pass: true, name: 'Urban Sports Club Classic', area: 'most halls', station: 'not Magic Mountain or Cliffhanger', note: 'Most halls cap Classic at 8 visits a month; Der Kegel, Ostbloc and Südbloc let you in daily. Berta Block caps it at 4.',
        prices: { adult: { member: [{ name: 'monthly plan', month: 75 }] }, reduced: { member: [{ name: 'monthly plan', month: 75 }] } } }
    ],
    foot: 'Adult and reduced prices from each hall\'s own price page and berlinbouldert.de, Urban Sports Club from its Berlin price page, all checked on 18 September 2026. Cards are counted at the price of the visits you use. Reduced 10-visit cards are not listed by most halls, so the student view leaves them out. Shoe hire is about 4 euro on top at most halls. Off-peak means weekday entry before 14:00 to 16:00, depending on the hall.'
  };
  /* DATA_END */

  var VISITS = [1, 2, 3, 4, 6, 8, 12];
  var MAXV = 16;
  var state = { visits: 4, rate: 'adult', time: 'any' };

  function eur(v) { return '€' + v.toFixed(2); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* Every way into one hall for n visits a month, cheapest first. */
  function ways(h, n) {
    var p = h.prices[state.rate];
    var out = [];
    var useEarly = state.time === 'early' && p.early && state.rate === 'adult';
    if (p.day) out.push({ kind: useEarly ? 'off-peak day ticket' : 'day ticket', month: (useEarly ? p.early : p.day) * n });
    if (p.ten) out.push({ kind: p.tenVisits + '-visit card', month: p.ten / p.tenVisits * n });
    (p.member || []).forEach(function (m) {
      if (m.cap && n > m.cap) return;
      out.push({ kind: m.name, month: m.month + (m.fee && m.term ? m.fee / m.term : 0) });
    });
    out.sort(function (a, b) { return a.month - b.month; });
    return out;
  }
  function best(h, n) { var w = ways(h, n); return w.length ? w[0] : null; }

  function buildOpts(el, list, key) {
    el.innerHTML = list.map(function (o) {
      return '<button type="button" role="radio" data-v="' + o.v + '" aria-checked="' + (String(state[key]) === String(o.v)) + '">' + esc(o.t) + '</button>';
    }).join('');
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state[key] = key === 'visits' ? Number(b.dataset.v) : b.dataset.v;
      Array.prototype.forEach.call(el.children, function (x) { x.setAttribute('aria-checked', String(x === b)); });
      render();
    });
  }

  var COLORS = ['#1B5E20', '#7CB342', '#C98B00', '#3B6EA8', '#8E44AD', '#E07A1F', '#16857A', '#9C6B3F', '#5D6D7E', '#B03A2E', '#2E7D32', '#6D4C41', '#00838F', '#AD1457'];

  function draw(order) {
    var cv = document.getElementById('plot');
    var dpr = window.devicePixelRatio || 1;
    var W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    var g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    var L = 40, R = 10, T = 10, B = 26;
    var top = 0;
    DATA.halls.forEach(function (h) { for (var n = 1; n <= MAXV; n++) { var b = best(h, n); if (b) top = Math.max(top, b.month); } });
    top = Math.ceil(Math.min(top, 140) / 20) * 20;
    function X(n) { return L + (n - 1) / (MAXV - 1) * (W - L - R); }
    function Y(v) { return T + (1 - Math.min(v, top) / top) * (H - T - B); }
    g.font = '10px Montserrat, sans-serif'; g.fillStyle = '#5b655c'; g.strokeStyle = 'rgba(18,61,24,.1)'; g.lineWidth = 1;
    for (var v = 0; v <= top; v += 20) { g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(W - R, Y(v)); g.stroke(); g.textAlign = 'right'; g.fillText('€' + v, L - 5, Y(v) + 3); }
    g.textAlign = 'center';
    [1, 4, 8, 12, 16].forEach(function (n) { g.textAlign = n === 16 ? 'right' : 'center'; g.fillText(n + (n === 16 ? ' visits' : ''), n === 16 ? W - R : X(n), H - 8); });

    var lead = order.slice(0, 3).map(function (r) { return r.h.id; });
    var faint = DATA.halls.filter(function (h) { return lead.indexOf(h.id) < 0; });
    var strong = lead.map(function (id) { return DATA.halls.filter(function (h) { return h.id === id; })[0]; });
    faint.concat(strong).forEach(function (h) {
      var on = lead.indexOf(h.id) >= 0;
      g.strokeStyle = on ? COLORS[lead.indexOf(h.id)] : (h.pass ? 'rgba(230,57,70,.55)' : 'rgba(120,130,122,.28)');
      g.lineWidth = on ? 3 : (h.pass ? 1.6 : 1.2);
      g.setLineDash(h.pass ? [6, 4] : []);
      g.beginPath();
      for (var n = 1; n <= MAXV; n++) { var b = best(h, n); if (!b) continue; if (n === 1) g.moveTo(X(n), Y(b.month)); else g.lineTo(X(n), Y(b.month)); }
      g.stroke();
      g.setLineDash([]);
    });

    g.strokeStyle = '#123D18'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(X(state.visits), T); g.lineTo(X(state.visits), H - B); g.stroke();
    strong.forEach(function (h, i) {
      var b = best(h, state.visits); if (!b) return;
      g.fillStyle = COLORS[i]; g.beginPath(); g.arc(X(state.visits), Y(b.month), 5, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke();
    });

    document.getElementById('legend').innerHTML = strong.map(function (h, i) {
      return '<span><i style="background:' + COLORS[i] + '"></i>' + esc(h.name) + '</span>';
    }).join('') + '<span><i style="background:rgba(120,130,122,.45)"></i>other halls</span>' +
      '<span><i class="dash"></i>multi-hall passes</span>';
  }

  function render() {
    var n = state.visits;
    var order = DATA.halls.map(function (h) { return { h: h, b: best(h, n), all: ways(h, n) }; })
      .filter(function (r) { return r.b; })
      .sort(function (a, b) { return a.b.month - b.b.month; });
    draw(order);

    var w = order[0];
    var cheapestDay = order.slice().sort(function (a, b) { return a.all[a.all.length - 1].month - b.all[b.all.length - 1].month; });
    var memberFlip = null;
    for (var k = 1; k <= MAXV; k++) { var bb = best(w.h, k); if (bb && bb.kind === 'membership') { memberFlip = k; break; } }
    var v = '<b>' + esc(w.h.name) + '</b> is the cheapest way to climb ' + n + (n === 1 ? ' time' : ' times') + ' a month: <b>' + eur(w.b.month) + '</b> on the ' + w.b.kind + ', about <b>' + eur(w.b.month / n) + '</b> a visit.';
    if (w.b.kind !== 'membership' && memberFlip) v += ' Its membership only starts to pay at <b>' + memberFlip + ' visits</b>.';
    if (/12-month/.test(w.b.kind)) {
      var free = order.map(function (r) { return { h: r.h, w: r.all.filter(function (x) { return !/12-month/.test(x.kind); })[0] }; })
        .filter(function (r) { return r.w; }).sort(function (a, b) { return a.w.month - b.w.month; })[0];
      if (free) v += ' If you would rather not sign for a year, next is <b>' + esc(free.h.name) + '</b> at <b>' + eur(free.w.month) + '</b> (' + free.w.kind + ').';
    }
    document.getElementById('verdict').innerHTML = v;

    document.getElementById('rank').innerHTML = order.map(function (r, i) {
      var alt = r.all[1] ? 'Next best: ' + r.all[1].kind + ' ' + eur(r.all[1].month) + '. ' : '';
      return '<li class="' + (i < 3 ? 'top' : '') + '"><span class="cc-n">' + (i + 1) + '</span><div><p class="cc-name">' + esc(r.h.name) +
        ' <small>' + esc(r.h.area) + ' · ' + esc(r.h.station) + '</small></p><p class="cc-how">Best way in: <b>' + r.b.kind + '</b>. ' + alt + esc(r.h.note || '') +
        '</p></div><div class="cc-eur">' + eur(r.b.month) + '<small>' + eur(r.b.month / n) + ' a visit</small></div></li>';
    }).join('');
  }

  buildOpts(document.getElementById('optVisits'), VISITS.map(function (x) { return { v: x, t: String(x) }; }), 'visits');
  buildOpts(document.getElementById('optRate'), [{ v: 'adult', t: 'Adult' }, { v: 'reduced', t: 'Student / reduced' }], 'rate');
  buildOpts(document.getElementById('optTime'), [{ v: 'any', t: 'Evenings or weekends' }, { v: 'early', t: 'Weekday daytime' }], 'time');
  document.getElementById('foot').innerHTML = DATA.foot;
  render();
  var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(render, 120); });
})();
</script>
<script src="../js/brand.js"></script>
</body>
</html>
