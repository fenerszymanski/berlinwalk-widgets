  html.bw-tools-detail.bw-tools-shell-v2 body .bw-tools-shell-v2-local-note {margin-bottom:8px!important;}

  }
  html.bw-tools-detail.bw-tools-shell-v2 body #comp-mozn18up #comp-mozn27df {

  }
  html.bw-tools-detail.bw-tools-shell-v2 body #comp-mozp1zlv .comp-mozp1zlv-container {

  html.bw-tools-detail.bw-tools-shell-v2 body #comp-mozp1zlv #comp-mozpfm6g {
    grid-area:title!important;height:auto!important;margin:0 0 4px!important;min-height:0!important;text-align:center!important;width:100%!important;

  html.bw-tools-detail.bw-tools-shell-v2 body #comp-mozp1zlv #comp-mozp2aft,
  html.bw-tools-detail.bw-tools-shell-v2 body #comp-mozp1zlv #comp-mozp3f25 {
    align-self:stretch!important;height:auto!important;justify-self:stretch!important;margin:0!important;min-height:168px!important;width:100%!important;

  @media (max-width:699px) {

</style>
<script>
  (function () {
    var path = String(window.location.pathname || '').toLowerCase().replace(/\/{2,}/g, '/');
    if (!/^\/tools\/[^/]+\/?$/.test(path)) return;
    // Native component selectors can now use the final shell before its JS
    // downloads. Do not hide the page while Wix hydrates.
    var slug = decodeURIComponent(path.split('/')[2]);
    var html = document.documentElement;
    if (slug === 'whats-open-in-berlin-today') {
      // Opt-in diagnostic only, not authentication. No cookie/storage or random
      // visitor assignment. Exact query prevents links retaining unrelated flags.
      window.BW_IS_OPEN_TODAY_TEST = function () {
        try {
          return window.location.origin === 'https://www.berlinwalk.com'
            && /^\/tools\/whats-open-in-berlin-today\/?$/.test(window.location.pathname)
            && window.location.search === '?bwStartupTest=open-today-20260909'
            && Date.now() < Date.UTC(2026, 8, 11);
        } catch (_) { return false; }
      };
      // Shared by the shell, native related-card icons, and the tour bridge.
      // No fetch interception: all unrelated requests and consent code stay intact.
      if (window.BW_IS_OPEN_TODAY_TEST()) {
      window.BW_GET_OPEN_TODAY_CATALOG = window.BW_GET_OPEN_TODAY_CATALOG || (function () {
        var pending = null;
        function valid(data) {
          if (!window.BW_IS_OPEN_TODAY_TEST()) throw new Error('Test no longer active');
          if (!data || !Array.isArray(data.tools) || data.tools.filter(function (tool) { return tool.slug === 'whats-open-in-berlin-today'; }).length !== 1) throw new Error('Open Today catalog unavailable');
          return data;
        }
        function request(file) {
          if (!window.BW_IS_OPEN_TODAY_TEST()) return Promise.reject(new Error('Test not active'));
          return fetch('https://fenerszymanski.github.io/berlinwalk-widgets/tools-hub/' + file, {credentials:'omit', cache:'no-cache'})
            .then(function (response) { if (!response.ok) throw new Error('Catalog HTTP error'); return response.json(); }).then(valid);
        }
        return function () {
          if (!window.BW_IS_OPEN_TODAY_TEST()) return Promise.reject(new Error('Outside Open Today test'));
          if (!pending) pending = request('open-today.json').catch(function () { return request('data.json'); }).catch(function (error) { pending = null; throw error; });
          return pending;
        };
      })();
      }
      html.classList.add('bw-tools-detail', 'bw-tools-shell-v2');
      html.setAttribute('data-bw-tools-slug', slug);
      html.setAttribute('data-bw-host-repair', 'pilot');
      html.classList.add('bw-host-repair-pilot');
      window.addEventListener('message', function (event) {
        var data = event.data;
        if (event.origin !== 'https://fenerszymanski.github.io' || !data || data.type !== 'bw-resize' || typeof data.height !== 'number' || !isFinite(data.height) || data.height <= 0 || data.height > 30000) return;
        var frame = document.querySelector('#comp-mozco5et iframe');
        if (frame && frame.contentWindow === event.source) frame.setAttribute('data-bw-shell-sized', '1');
      });
    }
    var commit = '__COMMIT_SHA__';
    var base = 'https://cdn.jsdelivr.net/gh/fenerszymanski/berlinwalk-widgets@' + commit + '/';
    var cssHref = base + 'css/berlintools-single-page-shell-v2.css?commit=' + commit;
    var jsSrc = base + 'js/berlintools-single-page-shell-v2.js?commit=' + commit;
    var eventBridgeSrc = base + 'js/tool-event-bridge-host.js?commit=' + commit;

    if (!document.querySelector('link[data-bw-shell-v2-css]')) {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      // A dynamically inserted stylesheet is otherwise not render-blocking.
      if (slug === 'whats-open-in-berlin-today') link.setAttribute('blocking', 'render');
      link.href = cssHref;
      link.setAttribute('data-bw-shell-v2-css', commit);
      document.head.appendChild(link);
    }

    if (!document.querySelector('script[data-bw-shell-v2-js]')) {
      var script = document.createElement('script');
      script.src = jsSrc;
      script.async = false;
      script.setAttribute('data-bw-shell-v2-js', commit);
      document.head.appendChild(script);
    }

    if (!document.querySelector('script[data-bw-tool-event-host]')) {
      var eventBridge = document.createElement('script');
      eventBridge.src = eventBridgeSrc;
      eventBridge.async = false;
      eventBridge.setAttribute('data-bw-tool-event-host', commit);
      document.head.appendChild(eventBridge);
    }
  })();
</script>
