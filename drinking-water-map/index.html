<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berlin Free Drinking Water Fountains Map | BerlinWalk</title>
  <link rel="stylesheet" href="../css/brand.css">
  <script defer src="../js/brand.js"></script>
  <style>
    body { background: transparent; padding: 0; margin: 0; }
    .bw-map {
      display: block;
      width: 100%;
      height: 560px;
      border: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .bw-water-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .bw-fallback-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #123D18;
      background: #EAF2DE;
      border: 1px solid #D1E2BA;
      border-radius: 6px;
      padding: 6px 12px;
      min-height: 36px;
      box-sizing: border-box;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .bw-fallback-link:hover,
    .bw-fallback-link:focus {
      background: #DBEAC8;
      border-color: #B9D494;
      color: #0E3013;
      outline: none;
    }
    .bw-fallback-link:focus-visible {
      outline: 2px solid #123D18;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <iframe
    class="bw-map"
    src="https://www.google.com/maps/d/embed?mid=1XJunMq4YF0zaZxh4AVtyA5v6FWjYV90I"
    title="Berlin free drinking water fountains map (Berliner Wasserbetriebe)"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div class="bw-water-actions">
    <a
      class="bw-fallback-link"
      href="https://www.google.com/maps/d/viewer?mid=1XJunMq4YF0zaZxh4AVtyA5v6FWjYV90I"
      target="_blank"
      rel="noopener">Open full map in Google Maps ↗</a>
  </div>
</body>
</html>
